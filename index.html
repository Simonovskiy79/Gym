<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Мой зал">
  <title>Мой зал</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Тренировка</h1>
    <button class="icon-btn" data-action="open-settings" aria-label="Настройки">⚙︎</button>
  </header>

  <main id="view"></main>

  <div id="rest" class="rest hidden">
    <span>Отдых</span>
    <strong id="rest-time">0:00</strong>
    <button data-action="rest-add">+30с</button>
    <button data-action="rest-stop">Стоп</button>
  </div>

  <nav class="tabs">
    <button data-tab="workout" class="active"><span>🏋️</span>Тренировка</button>
    <button data-tab="history"><span>📅</span>История</button>
    <button data-tab="progress"><span>📈</span>Прогресс</button>
    <button data-tab="exercises"><span>📋</span>Упражнения</button>
    <button data-tab="claude"><span>✨</span>Claude</button>
  </nav>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

  <script src="app.js"></script>
  <script src="claude.js"></script>
</body>
</html>
